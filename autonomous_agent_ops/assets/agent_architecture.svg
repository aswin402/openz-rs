<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="680" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="320" x2="1000" y2="320"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="480" x2="1000" y2="480"/>
    <line x1="0" y1="560" x2="1000" y2="560"/>
    <line x1="100" y1="0" x2="100" y2="680"/>
    <line x1="250" y1="0" x2="250" y2="680"/>
    <line x1="500" y1="0" x2="500" y2="680"/>
    <line x1="750" y1="0" x2="750" y2="680"/>
    <line x1="900" y1="0" x2="900" y2="680"/>
  </g>

  <!-- Title Header -->
  <g id="header">
    <text x="50" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">OpenZ 24/7 Autonomous Agent Architecture</text>
    <text x="50" y="72" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">High-Performance Zero-IPC Monolith &amp; Resilient State Orchestration</text>
    <rect x="830" y="32" width="120" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="846" cy="46" r="4" fill="#10b981"/>
    <text x="858" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">260 Native Tools</text>
  </g>

  <!-- Section 1: Ingress Layer -->
  <g id="ingress-layer">
    <rect x="50" y="95" width="900" height="85" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <text x="70" y="120" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">1. INGRESS &amp; TRIGGERS</text>
    
    <!-- Channel Nodes -->
    <g transform="translate(70, 130)">
      <rect width="120" height="36" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="60" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Headless CLI / TUI</text>
    </g>
    <g transform="translate(205, 130)">
      <rect width="120" height="36" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="60" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">WebSocket Gateway</text>
    </g>
    <g transform="translate(340, 130)">
      <rect width="130" height="36" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="65" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Telegram / Discord</text>
    </g>
    <g transform="translate(485, 130)">
      <rect width="120" height="36" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="60" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">WhatsApp Webhook</text>
    </g>
    <g transform="translate(620, 130)">
      <rect width="150" height="36" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="75" y="22" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⏰ Chronos (Cron Jobs)</text>
    </g>
    <g transform="translate(785, 130)">
      <rect width="145" height="36" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="72" y="22" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SOP Auto-Workflows</text>
    </g>
  </g>

  <!-- Connector Line 1 to 2 -->
  <line x1="500" y1="180" x2="500" y2="210" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="496,210 500,217 504,210" fill="#0ea5e9"/>

  <!-- Section 2: Core Autonomous TurnState Machine -->
  <g id="state-machine">
    <rect x="50" y="220" width="900" height="130" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <text x="70" y="246" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">2. ATOMIC 5-STAGE AUTONOMOUS TURNSTATE MACHINE</text>
    
    <!-- State Pills -->
    <g transform="translate(70, 260)">
      <rect width="140" height="66" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="70" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STAGE 1: SENSE</text>
      <text x="70" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Restore Session (WAL)</text>
      <text x="70" y="56" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Telemetry &amp; Worktree</text>
    </g>

    <line x1="210" y1="293" x2="235" y2="293" stroke="#64748b" stroke-width="2"/>
    <polygon points="233,289 239,293 233,297" fill="#64748b"/>

    <g transform="translate(240, 260)">
      <rect width="140" height="66" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
      <text x="70" y="26" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STAGE 2: COMPACT</text>
      <text x="70" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Headroom Z-Context</text>
      <text x="70" y="56" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">>120 Turns Summarizer</text>
    </g>

    <line x1="380" y1="293" x2="405" y2="293" stroke="#64748b" stroke-width="2"/>
    <polygon points="403,289 409,293 403,297" fill="#64748b"/>

    <g transform="translate(410, 260)">
      <rect width="140" height="66" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <text x="70" y="26" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STAGE 3: BUILD</text>
      <text x="70" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Prompt + Graph Memory</text>
      <text x="70" y="56" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Skills &amp; Activity State</text>
    </g>

    <line x1="550" y1="293" x2="575" y2="293" stroke="#64748b" stroke-width="2"/>
    <polygon points="573,289 579,293 573,297" fill="#64748b"/>

    <g transform="translate(580, 260)">
      <rect width="150" height="66" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.8"/>
      <text x="75" y="26" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STAGE 4: ACT &amp; VERIFY</text>
      <text x="75" y="44" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">LLM Turn + 260 Tools</text>
      <text x="75" y="56" fill="#fb7185" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">SecurityGuard + Seccomp</text>
    </g>

    <line x1="730" y1="293" x2="755" y2="293" stroke="#64748b" stroke-width="2"/>
    <polygon points="753,289 759,293 753,297" fill="#64748b"/>

    <g transform="translate(760, 260)">
      <rect width="165" height="66" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="82" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STAGE 5: CURATE</text>
      <text x="82" y="44" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Async Background Task</text>
      <text x="82" y="56" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Synthesizes Skills &amp; USER.md</text>
    </g>
  </g>

  <!-- Connector Line 2 to 3 -->
  <line x1="500" y1="350" x2="500" y2="380" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="496,380 500,387 504,380" fill="#818cf8"/>

  <!-- Section 3: In-Process Subsystem Grid -->
  <g id="subsystem-grid">
    <rect x="50" y="390" width="900" height="150" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <text x="70" y="416" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">3. ZERO-IPC IN-PROCESS NATIVE ENGINE (260 TOOLS)</text>
    
    <!-- Engine Tiles -->
    <g transform="translate(70, 430)">
      <rect width="195" height="92" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔍 SearchXyz Engine</text>
      <text x="14" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">In-process Tantivy full-text index</text>
      <text x="14" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">DuckDuckGo live web research</text>
      <text x="14" y="72" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Native knowledge graph links</text>
    </g>

    <g transform="translate(280, 430)">
      <rect width="195" height="92" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="700">📄 OpenDoc Intelligence</text>
      <text x="14" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Calamine &amp; RDocx parsing</text>
      <text x="14" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">DOCX / XLSX / PPTX / PDF</text>
      <text x="14" y="72" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Markdown table preservation</text>
    </g>

    <g transform="translate(490, 430)">
      <rect width="195" height="92" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#f472b6" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🎨 OpenMedia &amp; Wavyte</text>
      <text x="14" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Vector SVG + resvg rasterize</text>
      <text x="14" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Mermaid diagrams &amp; charts</text>
      <text x="14" y="72" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Programmatic MP4 CPU video</text>
    </g>

    <g transform="translate(700, 430)">
      <rect width="225" height="92" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🛡️ Seccomp Sandbox &amp; Memory</text>
      <text x="14" y="44" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">Linux BPF syscall filter (pre_exec)</text>
      <text x="14" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">FastEmbed 384d semantic vectors</text>
      <text x="14" y="72" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">SQLite WAL working memory</text>
    </g>
  </g>

  <!-- Section 4: Persistence & Storage Layer -->
  <g id="storage-layer" transform="translate(50, 560)">
    <rect width="900" height="95" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="24" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">4. DURABLE 24/7 STORAGE SUBSYSTEM (~/.openz/)</text>

    <!-- File Stores -->
    <g transform="translate(20, 36)">
      <rect width="195" height="44" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">📂 sessions/*.json</text>
      <text x="12" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">WAL crash-proof turn records</text>
    </g>

    <g transform="translate(230, 36)">
      <rect width="195" height="44" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">🧠 memory.db &amp; graph_memory.db</text>
      <text x="12" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Entity/relation triples + FastEmbed</text>
    </g>

    <g transform="translate(440, 36)">
      <rect width="195" height="44" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">⚡ skills/*.md &amp; USER.md</text>
      <text x="12" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Autonomous curator synthesized skills</text>
    </g>

    <g transform="translate(650, 36)">
      <rect width="230" height="44" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">⏱️ cron_jobs.json &amp; heartbeat.log</text>
      <text x="12" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">Background scheduled routines &amp; audit</text>
    </g>
  </g>
</svg>
