[package]
name = "openz"
version = "0.0.228"
edition = "2021"


[workspace]
members = [
    "."
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.38", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "gzip", "brotli"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24.0", features = ["rustls-tls-webpki-roots"] }
inquire = "0.7"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }
rand = "0.8"
async-trait = "0.1"
dotenvy = "0.15"
base64 = "0.22.1"
hmac = "0.12"
hex = "0.4"
arboard = "3.6.1"
image = "0.25.10"
imageproc = "0.25.0"
tiny-skia = "0.11.4"
plotters = "0.3.5"
simple-mermaid = "0.2.0"
crossterm = "0.29.0"
ratatui = "0.29"
open = "5.2"
scraper = "0.19"
ego-tree = "0.6"
notify = "6.1.1"
percent-encoding = "2.3"
cron = "0.12"
tonic = "0.11"
prost = "0.12"
calamine = "0.35.0"
pdf-extract = "0.10.0"
docx-rs = "0.4.20"
spider = { version = "2.21.0", default-features = false, features = ["regex"] }
wasmtime = "45.0.1"
fastembed = { version = "5.16.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls", "image-models"] }
wasmtime-wasi = "45.0.1"
diffy = "0.5.0"
html2md = "0.2.15"
ab_glyph = "0.2"
thirtyfour = "0.37.1"
imap = { version = "3.0.0-alpha.12", default-features = false, features = ["rustls-tls"] }
lettre = { version = "0.11.7", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mailparse = "0.15.0"
sha2 = "0.10"
fs2 = "0.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
oxc_parser = "0.30.0"
oxc_allocator = "0.30.0"
oxc_codegen = "0.30.0"
oxc_span = "0.30.0"
oxc_ast = "0.30.0"
oxc_syntax = "0.30.0"
libc = "0.2"
mermaid-rs-renderer = "0.2.2"
tantivy = "0.22"
governor = "0.8"
lru = "0.12"
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2"
tower = { version = "0.5", features = ["util"] }
url = "2"
svg = "0.17"
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
usvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
lyon = "1.0"
kurbo = { version = "0.13", features = ["serde"] }
parley = { version = "0.7.0", default-features = false, features = ["std"] }
vello_cpu = { version = "0.0.6", default-features = false, features = ["std", "text", "u8_pipeline"] }
wgpu = "23.0"
bytemuck = "1.19"
glob = "0.3"
pollster = "0.3"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
ndarray = "0.17"
ort = { version = "2.0.0-rc.9", default-features = false, features = ["half", "ndarray", "std", "tls-rustls", "download-binaries"] }
toml = "0.8"
sysinfo = "0.32"
rdocx = "0.1"
pptx = "0.1"
lopdf = "0.31"
rust_xlsxwriter = "0.68"
csv = "1.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
roxmltree = "0.19"
html5ever = "0.27"
pulldown-cmark = "0.11"
comrak = "0.25"
rayon = "1.10"

[features]
default = ["js-rendering"]
js-rendering = []
ocr = []

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[build-dependencies]
tonic-build = "0.11"

[profile.release]
opt-level = 3           # Maximize runtime optimizations
codegen-units = 1       # Reduces compiler RAM usage and yields better optimizations
lto = "thin"            # Link-Time Optimization: reduces peak linker memory usage and final ROM size
debug = false           # Exclude debug symbols to minimize compile RAM usage
strip = true            # Strip symbols and debug info from the final binary (significantly reduces ROM footprint)

[profile.release-small]
inherits = "release"
opt-level = "z"         # Optimize aggressively for binary size
lto = "fat"             # Fat LTO for maximum dead-code elimination
panic = "abort"         # Removes unwinding tables (~10-20% binary size reduction)
codegen-units = 1
strip = true
debug = false

[profile.release-balanced]
inherits = "release"
opt-level = 2           # Faster to compile than full release while still optimized for daily local updates
codegen-units = 4       # More parallel codegen than full release; moderate RAM use with -j 2
lto = false             # Avoid ThinLTO linker memory/time spikes during local updates
strip = true
debug = false

[profile.release-low-resource]
inherits = "release"
opt-level = 1           # Minimize compile pressure for low-memory machines
codegen-units = 1
lto = false             # Low-resource mode prioritizes finishing without linker spikes
strip = true
debug = false

[profile.dev]
opt-level = 0
debug = 0               # Disable debug symbols to eliminate multi-gigabyte linker RAM exhaustion
codegen-units = 2       # Cap internal codegen threads to 2 to prevent RAM exhaustion and laptop lag

[profile.test]
opt-level = 0
debug = 0               # Disable debug symbols to eliminate test linker memory spikes
codegen-units = 2       # Cap test compile parallel units to 2 to eliminate swap thrashing


